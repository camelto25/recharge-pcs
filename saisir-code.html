  <title>Confirmation du code PCS</title>

    body {
      font-family: Arial, sans-serif;
      background: #ffb300;
      display: flex;
      justify-content: center;

      min-height: 100vh;
    }

      background: white;

      margin-bottom: 20px;
    }

    h2 {

    }

    .input-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .input-container input {
      width: 40px;
      height: 50px;
      font-size: 24px;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 4px;
    }

    button {
      background-color: #388e3c;
      color: white;
      border: none;

      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

      font-weight: bold;

      display: none;
    }

    }

      border-radius: 5px;
